      x-security-bug: BUG-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name:           { type: string }
                contact_person: { type: string, nullable: true }
                phone:          { type: string }
                email:          { type: string, nullable: true }
                address:        { type: string, nullable: true }
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /suppliers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: Get supplier by ID
      operationId: getSupplier
      tags: [suppliers]
      security: []
      responses:
        '200':
          description: Supplier found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    put:
      summary: Update supplier
      operationId: updateSupplier
      tags: [suppliers]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:           { type: string }
                contact_person: { type: string, nullable: true }
                phone:          { type: string }
                email:          { type: string, nullable: true }
                address:        { type: string, nullable: true }
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      summary: Delete supplier (admin only)
      operationId: deleteSupplier
      tags: [suppliers]
      security:
        - ClerkBearer: []
      x-roles: [admin]
      responses:
        '200':
          description: Supplier deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:  { type: string }
                  supplier: { $ref: '#/components/schemas/Supplier' }
        '401': { description: Not authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ─── WHOLESALE ─────────────────────────────────────────────────────────────
  # BUG-01: GET and POST are public; DELETE is admin-only.
  # BUG-08: POST has no idempotency guard.

  /wholesale/sales:
    get:
      summary: List wholesale sales
      operationId: listWholesaleSales
      tags: [wholesale]
      security: []
      x-security-bug: BUG-01
      responses:
        '200':
          description: Wholesale sales list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WholesaleSale' }

    post:
      summary: Create wholesale sale
      operationId: createWholesaleSale
      tags: [wholesale]
      security: []
      x-security-bug: BUG-01
      x-idempotency-bug: BUG-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicine_name, quantity, price_per_unit, shopkeeper_name]
              properties:
                medicine_name:   { type: string }
                quantity:        { type: integer, minimum: 1 }
                price_per_unit:  { type: number, minimum: 0 }
                shopkeeper_name: { type: string }
                gst_number:      { type: string, nullable: true }
                sale_date:       { type: string, format: date }
      responses:
        '201':
          description: Wholesale sale created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WholesaleSale' }
        '400':
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wholesale/sales/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Delete wholesale sale (admin only)
      operationId: deleteWholesaleSale
      tags: [wholesale]
      security:
        - ClerkBearer: []
      x-roles: [admin]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401': { description: Not authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wholesale/purchases:
    get:
      summary: List wholesale purchases
      operationId: listWholesalePurchases
      tags: [wholesale]
      security: []
      x-security-bug: BUG-01
      responses:
        '200':
          description: Wholesale purchase list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WholesalePurchase' }

    post:
      summary: Create wholesale purchase
      operationId: createWholesalePurchase
      tags: [wholesale]
      security: []
      x-security-bug: BUG-01
      x-idempotency-bug: BUG-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [medicine_name, quantity, price_per_unit, supplier_name]
              properties:
                medicine_name:  { type: string }
                quantity:       { type: integer, minimum: 1 }
                price_per_unit: { type: number, minimum: 0 }
                supplier_name:  { type: string }
                gst_number:     { type: string, nullable: true }
                purchase_date:  { type: string, format: date }
      responses:
        '201':
          description: Wholesale purchase created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WholesalePurchase' }
        '400':
          description: Missing required fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wholesale/purchases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Delete wholesale purchase (admin only)
      operationId: deleteWholesalePurchase
      tags: [wholesale]
      security:
        - ClerkBearer: []
      x-roles: [admin]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401': { description: Not authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

tags:
  - name: health
    description: Server and DB health check
  - name: auth
    description: Clerk user synchronisation and admin listing
  - name: customers
    description: Retail customer CRUD (BUG-01 — currently public)
  - name: employees
    description: Staff management (auth required)
  - name: inventory
    description: Medicine master data and stock (partially protected)
  - name: ocr
    description: Invoice OCR scanning (BUG-05 — currently public, no validation)
  - name: purchases
    description: Stock purchase recording (BUG-01 — currently public)
  - name: reports
    description: Dashboard and sales trend reports (BUG-01 — currently public)
  - name: sales
    description: POS sales and invoice generation (BUG-01 — currently public)
  - name: store
    description: Shop profile/settings
  - name: suppliers
    description: Supplier CRUD (DELETE is admin-only)
  - name: wholesale
    description: Wholesale sales and purchases (DELETE is admin-only)
